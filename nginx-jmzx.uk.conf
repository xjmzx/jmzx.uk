# /etc/nginx/sites-available/jmzx.uk — certbot adds the 443 block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name jmzx.uk www.jmzx.uk;
    root /var/www/jmzx.uk;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    location = /favicon.svg { expires 7d; }
}
